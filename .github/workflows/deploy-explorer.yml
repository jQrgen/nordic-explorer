# Build the Nordic Crypto Explorer (a Next.js static export) and copy out/
# to /var/www/explorer on electrum-1 (explorer.nordiccrypto.no). Static files only:
# nothing is built on the server. The SSH key is restricted server-side to rrsync
# into /var/www/explorer. Never print EXPLORER_SSH_KEY.
name: Deploy explorer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: explorer-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check export
        run: test -f out/nexa/index.html && test -f out/bch/index.html && test -f out/index.html
      - name: Upload to electrum-1
        env:
          SSH_KEY: ${{ secrets.EXPLORER_SSH_KEY }}
          KNOWN_HOST: "91.99.122.75 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAXOJuII8CxuyczXraGEhyGfZNsV9K9ODcoUHqczW1te"
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/explorer_key
          chmod 600 ~/.ssh/explorer_key
          printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts
          rsync -rlz --delete --chmod=D755,F644 --exclude=.well-known \
            -e "ssh -i $HOME/.ssh/explorer_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            out/ root@91.99.122.75:./
          rm -f ~/.ssh/explorer_key
