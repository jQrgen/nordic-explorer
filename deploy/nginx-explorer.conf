# explorer.nordiccrypto.no: static files only (Next.js static export in /var/www/explorer).
server {
    listen 80;
    listen [::]:80;
    server_name explorer.nordiccrypto.no;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/explorer;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name explorer.nordiccrypto.no;

    ssl_certificate     /etc/letsencrypt/live/explorer.nordiccrypto.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/explorer.nordiccrypto.no/privkey.pem;

    root /var/www/explorer;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / { return 302 /bch/; }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The static export has one shell per section (/bch/block/index.html and so on).
    # Detail pages read a query string. These redirects keep path-style URLs working
    # after this file is installed on the server. The deploy workflow does not copy
    # it; reload nginx by hand. Until then, the pages' own script sends the same
    # paths on to the query form (the current error_page 404 still serves that script).
    location ~ ^/(bch|nexa)/block/([0-9]+)/?$ {
        return 302 /$1/block/?height=$2;
    }
    location ~ "^/(bch|nexa)/tx/([0-9A-Fa-f]{64})/?$" {
        return 302 /$1/tx/?txid=$2;
    }
    location ~ ^/(bch|nexa)/address/([^/.]+)/?$ {
        return 302 /$1/address/?address=$2;
    }
    location ~ ^/(bch|nexa)/token/([^/.]+)/?$ {
        return 302 /$1/token/?id=$2;
    }

    # Token document pass-through (deploy/doc-proxy.mjs, systemd unit doc-proxy.service).
    location = /doc-proxy {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
