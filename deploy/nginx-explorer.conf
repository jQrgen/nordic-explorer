# explorer.nordiccrypto.no: static files only (Next.js static export in /var/www/explorer).
server {
    listen 80;
    listen [::]:80;
    server_name explorer.nordiccrypto.no;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/explorer;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name explorer.nordiccrypto.no;

    ssl_certificate     /etc/letsencrypt/live/explorer.nordiccrypto.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/explorer.nordiccrypto.no/privkey.pem;

    root /var/www/explorer;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / { return 302 /nexa/; }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
